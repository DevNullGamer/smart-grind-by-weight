name: Deploy Web Flasher

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/web-flasher/**'  # Deploy when web-flasher files change (after firmware commit)
  release:
    types: [ published, unpublished, deleted ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
  deployments: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Populate firmware assets from releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          rm -rf tools/web-flasher/firmware
          mkdir -p tools/web-flasher/firmware

          REPO="${{ github.repository }}"
          echo "Fetching release list for $REPO"

          tags=$(gh api \
            -H "Accept: application/vnd.github+json" \
            --paginate \
            "/repos/${REPO}/releases?per_page=100" \
            --jq 'map(select(.draft == false)) | .[].tag_name')

          if [ -z "$tags" ]; then
            echo "No published releases found"
            exit 0
          fi

          for tag in $tags; do
            tag_start=$(date +%s)
            download_dir="tools/web-flasher/firmware/${tag}"
            mkdir -p "$download_dir"
            echo "[$(date -u +%H:%M:%S)] Downloading assets for $tag"
            gh release download "$tag" \
              --repo "$REPO" \
              --dir "$download_dir" \
              --clobber
            tag_end=$(date +%s)
            echo "[$(date -u +%H:%M:%S)] Finished $tag in $((tag_end - tag_start))s"
          done

          python3 - <<'PY'
          if True:
              import json
              import os

              firmware_root = "tools/web-flasher/firmware"
              entries = []

              for tag in sorted(os.listdir(firmware_root), reverse=True):
                  tag_path = os.path.join(firmware_root, tag)
                  if not os.path.isdir(tag_path):
                      continue

                  prerelease = any(key in tag for key in ("-rc", "-beta", "-alpha"))
                  version = tag.lstrip('v')
                  base = f"smart-grind-by-weight-{tag}"
                  legacy_v2_base = f"{base}-waveshare-164-v2"

                  # Releases before the unified image have separate V1 / V2 artifacts (V2 only in later ones).
                  # Unified releases ship one image whose manifest name is marked "auto-detect".
                  manifest_name = ""
                  try:
                      with open(os.path.join(tag_path, f"{base}.manifest.json"), encoding="utf-8") as handle:
                          manifest_name = json.load(handle).get("name", "")
                  except (OSError, ValueError):
                      pass

                  if "auto-detect" in manifest_name:
                      variants = (("Waveshare 1.64 V1 + V2 (auto-detect)", base),)
                  else:
                      variants = (
                          ("Waveshare 1.64 V1", base),
                          ("Waveshare 1.64 V2", legacy_v2_base),
                      )

                  for board, artifact_base in variants:
                      manifest_rel = f"firmware/{tag}/{artifact_base}.manifest.json"
                      ota_rel = f"firmware/{tag}/{artifact_base}-web-ota.bin"
                      manifest_abs = os.path.join(tag_path, f"{artifact_base}.manifest.json")
                      ota_abs = os.path.join(tag_path, f"{artifact_base}-web-ota.bin")

                      # Older releases contain only the original V1 artifact.
                      if not (os.path.isfile(manifest_abs) and os.path.isfile(ota_abs)):
                          continue

                      entries.append({
                          "tag": tag,
                          "version": version,
                          "board": board,
                          "display": f"{tag} - {board}",
                          "prerelease": prerelease,
                          "manifest": manifest_rel,
                          "ota": ota_rel,
                      })

              index_path = os.path.join(firmware_root, "index.json")
              with open(index_path, "w", encoding="utf-8") as handle:
                  json.dump(entries, handle, indent=2)
                  handle.write("\n")
          PY
        
      - name: Generate update channel index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Publish dates (tag<TAB>timestamp) of the non-draft releases; the generator falls back to file times
          # Best effort: a failure here must never block the existing deploy
          gh api \
            -H "Accept: application/vnd.github+json" \
            --paginate \
            "/repos/${{ github.repository }}/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | "\(.tag_name)\t\(.published_at)"' > "$RUNNER_TEMP/published.tsv" \
            || : > "$RUNNER_TEMP/published.tsv"

          # update-stable.json / update-beta.json: highest unified release per channel (see tools/update_index.py)
          python3 tools/update_index.py \
            --firmware-root tools/web-flasher/firmware \
            --output-dir tools/web-flasher \
            --published-tsv "$RUNNER_TEMP/published.tsv"

      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}
          path: ./tools/web-flasher

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}
