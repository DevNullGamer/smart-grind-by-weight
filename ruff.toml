# Errors-only lint for CI: syntax errors, invalid format strings / comparisons, undefined names.
# Style rules are intentionally off; widen the selection deliberately, not by accident.
target-version = "py39"
extend-exclude = ["tools/venv", ".pio", "firmware_cache", ".worktrees"]

[lint]
select = ["E9", "F63", "F7", "F82"]

[lint.per-file-ignores]
# PlatformIO/SCons injects Import() and env into these scripts
"tools/build-scripts/*.py" = ["F821"]
