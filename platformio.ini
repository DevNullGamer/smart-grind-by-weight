; Default environment settings
[platformio]
default_envs = waveshare-esp32s3-touch-amoled-164

[env:waveshare-esp32s3-touch-amoled-164]
# Pin to pioarduino fork platform 55.03.32
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.32/platform-espressif32.zip
#platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

build_flags =
    -Iinclude
    -Ofast
    -Wall
    '-D LV_CONF_PATH="${platformio.include_dir}/lv_conf.h"'
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DNO_GLOBAL_UPDATE     ; Required by esp32-flashz
    -DFZ_NOHTTPCLIENT      ; Disable HTTP client (BLE only)
    
lib_deps = 
    lvgl/lvgl@ # ^9.3.0
    vortigont/esp32-flashz # 1.1.5

extra_scripts = 
    tools/build-scripts/pre_build.py
    tools/build-scripts/post_build.py
    tools/build-scripts/custom_targets.py

build_src_filter = +<*> -<.git/> -<.svn/>

; Custom partition table for delta OTA updates
board_build.partitions = partitions.csv

; Include local components for delta OTA
lib_extra_dirs = components

; Upload via USB settings
upload_speed = 921600
; upload_port = /dev/cu.usbmodem*

; Monitor settings  
monitor_speed = 115200
; monitor_port = /dev/cu.usbmodem*

[env:waveshare-esp32s3-touch-amoled-164-debug]
extends = env:waveshare-esp32s3-touch-amoled-164
build_type = debug
build_flags = 
    ${env:waveshare-esp32s3-touch-amoled-164.build_flags}
    -DUI_DEBUG_SERIAL_DELAY_MS=2000

; Suppress Wire library logs to suppress known requestFrom(): i2cWriteReadNonStop returned Error -1
; messages popping while polling the touchscreen controller. We have to poll
; because the touchscreen does not support interrupts.
monitor_filters = esp32_exception_decoder, default, hiding_filter
monitor_options =
    --filter hiding_filter:--regex ".*i2cWriteReadNonStop.*" --invert

[env:waveshare-esp32s3-touch-amoled-164-mock]
extends = env:waveshare-esp32s3-touch-amoled-164-debug

build_flags = 
    ${env:waveshare-esp32s3-touch-amoled-164.build_flags}
    -DMOCK_BUILD
    -DDEBUG_ENABLE_LOADCELL_MOCK=1
    -DDEBUG_ENABLE_GRINDER_BACKGROUND_INDICATOR=1

; Measurement build: pulses the motor output at boot to time RMT pulses. GRINDER MUST BE DISCONNECTED FROM MAINS.
[env:waveshare-esp32s3-touch-amoled-164-rmt-selftest]
extends = env:waveshare-esp32s3-touch-amoled-164

build_flags =
    ${env:waveshare-esp32s3-touch-amoled-164.build_flags}
    -DDEBUG_RMT_PULSE_SELFTEST=1

; Measurement build: one-shot WiFi heap spike ~30 s after boot (WiFi + httpd + mDNS + HTTPS pull vs BLE).
; Needs include/spike_secrets.h (gitignored, see spike_secrets.h.example). Never touches the grinder.
; Do not grind during the spike. The built image contains the WiFi password in plaintext: do not share it.
[env:waveshare-esp32s3-touch-amoled-164-wifi-spike]
extends = env:waveshare-esp32s3-touch-amoled-164

build_flags =
    ${env:waveshare-esp32s3-touch-amoled-164.build_flags}
    -DDEBUG_WIFI_HEAP_SPIKE=1

; Spike experiment F4: mbedTLS allocations (esp_mbedtls_mem_calloc/free) served from PSRAM, stronger TLS tests.
[env:waveshare-esp32s3-touch-amoled-164-wifi-spike-tlspsram]
extends = env:waveshare-esp32s3-touch-amoled-164-wifi-spike

build_flags =
    ${env:waveshare-esp32s3-touch-amoled-164-wifi-spike.build_flags}
    -DDEBUG_SPIKE_TLS_PSRAM=1

; Dev build: seeds WiFi credentials from the gitignored include/spike_secrets.h into NVS when none are stored,
; and arms the push endpoint flag. The image contains the WiFi password in plaintext: do not share it.
; DEBUG_UPDATE_PROMPT_AUTOREPLY plays the user at the grinder screen: 1 accept (default here), 2 decline, 3 never reply.
[env:waveshare-esp32s3-touch-amoled-164-wifi-dev]
extends = env:waveshare-esp32s3-touch-amoled-164

build_flags =
    ${env:waveshare-esp32s3-touch-amoled-164.build_flags}
    -DDEBUG_WIFI_DEV_CREDS=1
    -DDEBUG_UPDATE_PROMPT_AUTOREPLY=1

; Test build: the continuous-run motor deadman fires after 3 s. Any continuous grind longer than that
; (prime, predictive, time mode, motor test) ends with "Err: motor" and the MOTOR_FAULT warning.
[env:waveshare-esp32s3-touch-amoled-164-deadman-test]
extends = env:waveshare-esp32s3-touch-amoled-164

build_flags =
    ${env:waveshare-esp32s3-touch-amoled-164.build_flags}
    -DDEBUG_GRINDER_DEADMAN_TEST=1

; Experiment: 150x BluetoothManager::disable()+enable() from a Core 1 task, then 150x from a Core 0 task, starting
; 20 s after boot ("[BLESTRESS]" log lines; a panic reboot continues the run and reports the crashed cycle).
[env:waveshare-esp32s3-touch-amoled-164-ble-stress]
extends = env:waveshare-esp32s3-touch-amoled-164

build_flags =
    ${env:waveshare-esp32s3-touch-amoled-164.build_flags}
    -DDEBUG_BLE_ENABLE_STRESS=1

; Same stress run with the old hard BLEDevice::deinit()/init() cycle, for comparison (leaks ~11 KB per cycle).
[env:waveshare-esp32s3-touch-amoled-164-ble-stress-harddeinit]
extends = env:waveshare-esp32s3-touch-amoled-164

build_flags =
    ${env:waveshare-esp32s3-touch-amoled-164.build_flags}
    -DDEBUG_BLE_ENABLE_STRESS=1
    -DDEBUG_BLE_HARD_DEINIT=1
