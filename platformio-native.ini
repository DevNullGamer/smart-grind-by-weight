; Host-side unit tests (no hardware), kept apart from platformio.ini because the
; native platform and the Espressif platform pin conflicting tool-scons versions
; when they share one project. Tests live in test_native/ (not test/, which would make
; the firmware build install the Unity test dependency). Run: pio test -c platformio-native.ini -e native-test
[platformio]
test_dir = test_native

[env:native-test]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -std=gnu++17
    -Isrc
build_src_filter =
    -<*>
    +<hardware/board_decide.cpp>
    +<hardware/board_config.cpp>
    +<hardware/rmt_pulse_math.cpp>
    +<hardware/sensor_health.cpp>
    +<controllers/grind_safety.cpp>
    +<controllers/grind_start_check.cpp>
    +<controllers/motor_test_check.cpp>
    +<network/wifi_credentials.cpp>
    +<system/image_header.cpp>
    +<system/sha_hex.cpp>
    +<network/update_http_logic.cpp>
    +<network/wifi_status_text.cpp>
    +<network/update_approval.cpp>
    +<network/update_prompt_text.cpp>
    +<network/update_ui_logic.cpp>
    +<system/boot_health_logic.cpp>
    +<network/release_index.cpp>
    +<network/pull_logic.cpp>
    +<network/pull_ui_text.cpp>
